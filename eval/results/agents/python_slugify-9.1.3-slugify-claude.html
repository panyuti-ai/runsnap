<style>

    --skip: #3a3322; --skip-line: #b8973a; --old: #a5a49d; --focus: #ecebe6;

:root[data-theme="dark"] {
  --bg: #151514; --panel: #1f1f1d; --text: #ecebe6; --muted: #8f8e87; --line: #33322f;
  --same: #2a3a2e; --same-hover: #34493a; --chg: #ff6369; --chg-soft: #3b1c1d; --on-chg: #1b0b0b;
  --skip: #3a3322; --skip-line: #b8973a; --old: #a5a49d; --focus: #ecebe6;
    --added: #3d5f8a; --removed-line: #6a6964; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
.mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 32px max(16px, env(safe-area-inset-right, 0px)) 64px max(16px, env(safe-area-inset-left, 0px)); }
.hero { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.hero .big { font-size: 56px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.hero .big.bad { color: var(--chg); }
.hero .txt { font-size: 22px; font-weight: 600; }
.hero .txt span { color: var(--muted); font-weight: 400; }
.labels { color: var(--muted); font-size: 13px; margin-top: 6px; word-break: break-all; }
.legend { display: flex; gap: 18px; margin: 14px 0 12px; color: var(--muted); font-size: 13px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.jump { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
.jump button { border: 0; background: var(--chg-soft); color: var(--chg); border-radius: 999px; padding: 3px 11px; cursor: pointer; font: 13px ui-monospace, Menlo, Consolas, monospace; }
.jump button.sel { background: var(--chg); color: var(--on-chg); }
.layout { display: grid; grid-template-columns: 1.2fr 1fr; gap: 18px; align-items: start; }
.map { display: grid; gap: 12px; min-width: 0; }
.mod { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.mod h3 { margin: 0 0 8px; font-size: 13px; color: var(--muted); font-weight: 600; word-break: break-all; }
.tiles { display: flex; flex-wrap: wrap; gap: 5px; }
.tile { border-radius: 6px; background: var(--same); cursor: pointer; border: 2px solid transparent; padding: 0; transition: transform .1s; }
.tile:hover { background: var(--same-hover); transform: scale(1.06); }
.tile:focus-visible, .jump button:focus-visible, .more:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.tile.changed { background: var(--chg); animation: pulse 1.6s ease-in-out infinite; }
.tile.skipped { background: var(--skip); border: 2px dashed var(--skip-line); }
.tile.added { background: var(--added); }
.tile.removed { background: transparent; border: 2px dashed var(--removed-line); }
.tile.sel { outline: 3px solid var(--focus); outline-offset: 2px; }
@keyframes pulse { 50% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--chg) 25%, transparent); } }
@media (prefers-reduced-motion: reduce) { .tile.changed { animation: none; } .tile, .g > summary::after { transition: none; } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 22px; position: sticky; top: 16px; min-width: 0; }
.card .fn { font-size: 20px; font-weight: 700; word-break: break-all; }
.card .where { color: var(--muted); font-size: 13px; word-break: break-all; }
.card .seen { color: var(--muted); font-size: 12px; margin: 2px 0 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; align-items: center; margin: 10px 0; }
.row .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
.row.top { align-items: start; }
.row.top .k { padding-top: 6px; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 2px 12px; background: var(--bg); border-radius: 8px; padding: 8px 12px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; word-break: break-all; }
.val { font-size: 26px; font-weight: 600; word-break: break-all; }
.val.small { font-size: 15px; font-weight: 500; color: var(--muted); }
.val.old { color: var(--old); }
.val.new { color: var(--chg); }
.val ins, .pair ins { background: var(--chg-soft); color: var(--chg); text-decoration: none; border-radius: 5px; padding: 0 2px; }
.val del, .pair del { color: var(--old); text-decoration-thickness: 2px; }
.arrow { color: var(--muted); font-size: 22px; padding-left: 76px; line-height: 1; }
.foot { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.stats { display: flex; flex-wrap: wrap; gap: 6px; }
.stat { background: var(--bg); border-radius: 999px; padding: 2px 10px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.stat b { color: var(--text); font-weight: 600; }
.more { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 8px; padding: 4px 12px; cursor: pointer; font: inherit; font-size: 13px; }
.all { margin-top: 14px; }
.all[hidden] { display: none; }
.all h4 { margin: 14px 0 6px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
.g { border-top: 1px solid var(--line); }
.g > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 44px minmax(0, 1fr) 16px; gap: 2px 10px; padding: 9px 0; border-radius: 6px; }
.g > summary::-webkit-details-marker { display: none; }
.g > summary:hover .pair { text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 4px; }
.g > summary:focus-visible, .rest:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.g > summary::after { content: "›"; grid-column: 3; grid-row: 1; color: var(--muted); font-size: 18px; line-height: 1; transition: transform .15s; justify-self: center; }
.g[open] > summary::after { transform: rotate(90deg); }
.g .n { grid-row: span 2; align-self: start; text-align: right; font-weight: 700; color: var(--chg); font-variant-numeric: tabular-nums; padding-top: 1px; }
.g .when { grid-column: 2; }
.g > .kv { margin: 0 26px 10px 54px; }
.g.extra[hidden] { display: none; }
.g .pair { font-size: 15px; font-weight: 600; word-break: break-all; }
.g .pair .to { color: var(--muted); font-weight: 400; margin: 0 6px; }
.g .pair i { color: var(--muted); font-weight: 400; font-style: normal; font-size: 13px; }
.g .when { display: flex; flex-wrap: wrap; gap: 4px; }
.g .when span { font-size: 12px; color: var(--muted); background: var(--bg); border-radius: 6px; padding: 0 7px; word-break: break-all; }
.rest { display: block; width: 100%; text-align: left; margin: 0; padding: 8px 0 4px 54px; border: 0; border-top: 1px solid var(--line); background: none; color: var(--text); font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; }
.rest:hover { text-decoration: underline; }
.g .when span b { color: var(--text); font-weight: 500; }
.empty { color: var(--muted); }
@media (max-width: 760px) { .layout { grid-template-columns: 1fr; } .card { position: static; } .hero .big { font-size: 44px; } }

<body>
<div class="wrap">
  <div class="hero"><div class="big" id="n"></div><div class="txt" id="headline"></div></div>
  <div class="labels mono" id="labels"></div>
  <div class="legend">
    <span><i style="background:var(--same)"></i>same as before</span>
    <span><i style="background:var(--chg)"></i>behavior changed</span>
    <span><i style="background:var(--added)"></i>new function</span>
    <span><i style="border:2px dashed var(--removed-line)"></i>removed function</span>
    <span><i style="background:var(--skip);border:2px dashed var(--skip-line)"></i>skipped: changes on every run</span>
    <span>bigger box = called more often</span>
  </div>
  <div class="jump" id="jump"></div>
  <div class="layout">
    <div class="map" id="map"></div>
    <div class="card" id="card"></div>
  </div>
</div>
<script>
const DATA = {"before": "base.sqlite", "after": "python_slugify-9.1.3-slugify-claude.sqlite", "rerun": "base2.sqlite", "funcs": [["slugify.__main__.main", 17, "same"], ["slugify.__main__.parse_args", 43, "same"], ["slugify.__main__.parse_args.<locals>.split_check", 3, "same"], ["slugify.__main__.slugify_params", 41, "same"], ["slugify._legacy._decode_entities", 4143, "same"], ["slugify._legacy._decode_entities.<locals>.<lambda>", 3248, "same"], ["slugify._legacy._transliterate", 2085, "same"], ["slugify._legacy.slugify", 4148, "same"], ["slugify._legacy.slugify.<locals>.<genexpr>", 17, "same"], ["slugify._legacy.smart_truncate", 2703, "same"], ["slugify.slugify._apply_replacements", 4776, "added"], ["slugify.slugify._decode_entities", 2443, "same"], ["slugify.slugify._decode_entities.<locals>.<lambda>", 496, "same"], ["slugify.slugify._delimited_words", 1306, "added"], ["slugify.slugify._modern_slugify", 2456, "same"], ["slugify.slugify._modern_slugify.<locals>.<genexpr>", 120, "same"], ["slugify.slugify._modern_truncate", 2441, "same"], ["slugify.slugify._numeric_reference", 490, "same"], ["slugify.slugify._transliterate", 2319, "same"], ["slugify.slugify.slugify", 6605, "same"], ["slugify.special.add_uppercase_char", 3, "same"]], "changes": {}};
const changedFuncs = Object.keys(DATA.changes).sort((a, b) => total(DATA.changes[b]) - total(DATA.changes[a]));
let selected = changedFuncs[0] || (DATA.funcs[0] && DATA.funcs[0][0]);
let showAll = false;

function total(c) { return c.changed + c.gone + c.new; }
function esc(s) { return String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch])); }
function moduleOf(f) {
  const parts = f.split(".");
  parts.pop();
  while (parts.length > 1 && /^[A-Z]/.test(parts[parts.length - 1])) parts.pop();  // methods go with their module
  return parts.join(".") || f;
}
function shortName(f) { const m = moduleOf(f); return f.startsWith(m + ".") ? f.slice(m.length + 1) : f; }
function strip(outcome) { return outcome.startsWith("returns ") ? outcome.slice(8) : outcome; }

// Word-level diff, so False -> True is marked as one word and (7.0, 0) -> (7.0, 1) marks only the 0.
function wordDiff(sa, sb) {
  const tok = s => s.match(/[A-Za-z0-9_.]+|[^A-Za-z0-9_.]/g) || [];
  const a = tok(sa), b = tok(sb), n = a.length, m = b.length;
  if (n * m > 250000) return [esc(sa), "<ins>" + esc(sb) + "</ins>"];
  const dp = Array.from({ length: n + 1 }, () => new Uint32Array(m + 1));
  for (let i = n - 1; i >= 0; i--)
    for (let j = m - 1; j >= 0; j--)
      dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  let L = "", R = "", i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && a[i] === b[j]) { L += esc(a[i]); R += esc(b[j]); i++; j++; }
    else if (j < m && (i >= n || dp[i][j + 1] >= dp[i + 1][j])) { R += "<ins>" + esc(b[j]) + "</ins>"; j++; }
    else { L += "<del>" + esc(a[i]) + "</del>"; i++; }
  }
  return [L, R];
}

function drawHeader() {
  const n = changedFuncs.length;
  document.getElementById("n").textContent = n;
  document.getElementById("n").className = "big" + (n ? " bad" : "");
  document.getElementById("headline").innerHTML =
    (n === 1 ? "function behaves differently" : "functions behave differently") +
    ` <span>of ${DATA.funcs.length} recorded</span>`;
  document.getElementById("labels").textContent =
    `before: ${DATA.before} → now: ${DATA.after}` + (DATA.rerun ? ` · noise filtered with: ${DATA.rerun}` : "");
  document.getElementById("jump").innerHTML = changedFuncs.map(f =>
    `<button class="${f === selected ? "sel" : ""}" data-f="${esc(f)}">${esc(shortName(f))}</button>`).join("");
  document.querySelectorAll(".jump button").forEach(b => b.addEventListener("click", () => select(b.dataset.f)));
}

function drawMap() {
  const mods = {};
  DATA.funcs.forEach(row => (mods[moduleOf(row[0])] ??= []).push(row));
  const max = Math.max(1, ...DATA.funcs.map(r => r[1]));
  document.getElementById("map").innerHTML = Object.keys(mods).sort().map(m => `
    <div class="mod"><h3 class="mono">${esc(m)}</h3><div class="tiles">${mods[m].map(([f, n, state]) => {
      const s = Math.round(18 + 62 * Math.sqrt(n / max));
      const label = `${shortName(f)} · ${n} calls` + (state === "skipped" ? " · skipped (changes every run)" : "");
      return `<button class="tile ${state} ${f === selected ? "sel" : ""}" data-f="${esc(f)}" title="${esc(label)}"
        aria-label="${esc(label)}" style="width:${s}px;height:${s}px"></button>`;
    }).join("")}</div></div>`).join("") || `<p class="empty">No calls were recorded.</p>`;
  document.querySelectorAll(".tile").forEach(t => t.addEventListener("click", () => select(t.dataset.f)));
}

// "<Unit.SECONDS: 2>" -> "Unit.SECONDS": enum and object reprs are noise in a small space.
function tidy(v) { return String(v).replace(/<([A-Za-z_][\w.]*): [^<>]*>/g, "$1"); }
// "a=1, b=[2, 3]" -> [["a", "1"], ["b", "[2, 3]"]]
function parseArgs(s) {
  if (!s) return [];
  return s.split(/, (?=[A-Za-z_]\w*=)/).map(p => { const i = p.indexOf("="); return [p.slice(0, i), tidy(p.slice(i + 1))]; });
}
function valuePair(g) {
  if (g.kind === "changed") return wordDiff(tidy(strip(g.before)), tidy(strip(g.after)));
  if (g.kind === "gone") return [esc(tidy(strip(g.before))), null];
  return [null, esc(tidy(strip(g.after)))];
}
// Arguments whose value differs between the groups; the rest are the same everywhere and hidden.
function varyingKeys(groups) {
  const seen = {};
  groups.forEach(g => parseArgs(g.args).forEach(([k, v]) => (seen[k] ??= new Set()).add(v)));
  const keys = Object.keys(seen).filter(k => seen[k].size > 1).sort((a, b) => seen[b].size - seen[a].size);
  return (keys.length ? keys : Object.keys(seen)).slice(0, 2);
}

function drawCard() {
  const card = document.getElementById("card");
  if (!selected) { card.innerHTML = `<p class="empty">Nothing to show.</p>`; return; }
  const c = DATA.changes[selected];
  const head = `<div class="fn mono">${esc(shortName(selected))}</div><div class="where mono">${esc(moduleOf(selected))}</div>`;
  if (!c) {
    const row = DATA.funcs.find(r => r[0] === selected);
    const msg = {
      skipped: "Skipped: its results already differ between two runs of the same code (time, random values), so changes here are not reported.",
      added: "New function: it did not exist before, so there is nothing to compare. If it broke something, the functions that call it show the change.",
      removed: "Removed function: it is no longer called. If removing it broke something, the functions that used it show the change.",
      same: "✓ Every recorded call gives the same result as before.",
    }[row[2]];
    card.innerHTML = head + `<p class="empty">${row[1]} calls recorded. ${msg}</p>`;
    return;
  }
  const g = c.groups[0];
  const [b, a] = valuePair(g);
  const testName = g.test.split("::").pop();
  const args = parseArgs(g.args);
  const stats = [[c.changed, "changed"], [c.gone, "gone"], [c.new, "new"], [c.tests, c.tests === 1 ? "test" : "tests"]]
    .filter(([n]) => n).map(([n, l]) => `<span class="stat"><b>${n}</b> ${l}</span>`).join("");
  const n = total(c);
  const keys = varyingKeys(c.groups);
  const titles = { changed: "Result changed", gone: "No longer called", new: "New calls" };
  const sections = ["changed", "gone", "new"].map(kind => {
    const gs = c.groups.filter(x => x.kind === kind);
    if (!gs.length) return "";
    const extra = gs.slice(8), extraCalls = extra.reduce((sum, x) => sum + x.count, 0);
    return `<h4>${titles[kind]}</h4>` + gs.map((gr, i) => {
      const [x, y] = valuePair(gr);
      const all = parseArgs(gr.args);
      const when = all.filter(([k]) => keys.includes(k))
        .map(([k, v]) => `<span class="mono">${esc(k)} <b>${esc(v)}</b></span>`).join("");
      return `<details class="g${i >= 8 ? " extra" : ""}" data-kind="${kind}" ${i >= 8 ? "hidden" : ""}>
        <summary><span class="n">${gr.count}×</span>
          <div class="pair mono">${x ?? "<i>not called</i>"}<span class="to">→</span>${y ?? "<i>not called</i>"}</div>
          <div class="when">${when}</div></summary>
        <dl class="kv mono">${all.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("") || "<dd>(no arguments)</dd>"}</dl>
        </details>`;
    }).join("") + (extra.length ? `<button class="rest" data-kind="${kind}"
        data-more="Show ${extra.length} more patterns (${extraCalls} calls)">Show ${extra.length} more patterns (${extraCalls} calls)</button>` : "");
  }).join("");
  card.innerHTML = head + `
    <div class="seen" title="${esc(g.test)}">seen in ${esc(testName)}</div>
    <div class="row top"><div class="k">Input</div>${args.length
      ? `<dl class="kv mono">${args.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>`
      : `<div class="kv mono">(no arguments)</div>`}</div>
    <div class="row"><div class="k">Before</div><div class="val old mono ${b === null ? "small" : ""}">${b ?? "not called with this input"}</div></div>
    <div class="arrow">↓</div>
    <div class="row"><div class="k">Now</div><div class="val new mono ${a === null ? "small" : ""}">${a ?? "not called with this input"}</div></div>
    <div class="foot"><div class="stats">${stats}</div>
      ${n > 1 ? `<button class="more" id="more">${showAll ? "Hide list" : `Show all ${n}`}</button>` : ""}</div>
    <div class="all" ${showAll ? "" : "hidden"}>${sections}</div>`;
  const more = document.getElementById("more");
  if (more) more.addEventListener("click", () => { showAll = !showAll; drawCard(); });
  card.querySelectorAll(".rest").forEach(btn => btn.addEventListener("click", () => {
    const rows = card.querySelectorAll(`.g.extra[data-kind="${btn.dataset.kind}"]`);
    const opening = rows[0].hidden;
    rows.forEach(r => { r.hidden = !opening; });
    btn.textContent = opening ? "Show fewer" : btn.dataset.more;
  }));
}

function select(f) { selected = f; showAll = false; drawHeader(); drawMap(); drawCard(); }
select(selected);
</script>
</body>
</html>
